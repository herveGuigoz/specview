name: Release specview

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to publish (for example, v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Validate stable tag and commit
        run: node scripts/release.mjs validate-tag "$RELEASE_TAG"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build frontend for unit tests
        run: make frontend
      - name: Run unit tests
        run: |
          go test -race -count=1 ./...
          npm --prefix ui run test:unit
          node --test scripts/release.test.mjs
        env:
          SPECVIEW_REQUIRE_NETWORK_TESTS: '1'
      - name: Refuse public release or replace failed draft
        run: node scripts/release.mjs prepare "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build archives and upload draft assets
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify downloaded assets and isolated binary, then publish
        run: node scripts/release.mjs publish "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ github.token }}

name: Verify specview
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci --no-audit --no-fund
      - run: npm --prefix ui run typecheck
      - run: npm --prefix ui run build
      - run: npm --prefix ui run test:unit
      - run: go test -race -count=1 ./...
        env:
          SPECVIEW_REQUIRE_NETWORK_TESTS: '1'
      - run: go build -trimpath -o bin/specview${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/specview
        env:
          CGO_ENABLED: '0'
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npm --prefix ui test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: specview-${{ runner.os }}
          path: |
            bin/
            test-results/

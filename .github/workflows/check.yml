name: Verify specview
on: pull_request
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci --no-audit --no-fund
      - run: npm --prefix ui run typecheck
      - run: npm --prefix ui run build
      - run: npm --prefix ui run test:unit
      - run: node --test scripts/release.test.mjs
      - run: go test -race -count=1 ./...
        env:
          SPECVIEW_REQUIRE_NETWORK_TESTS: '1'
      - run: go build -trimpath -o bin/specview ./cmd/specview
        env:
          CGO_ENABLED: '0'
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npm --prefix ui test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: specview-${{ runner.os }}
          path: |
            bin/
            test-results/

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.0
          install-only: true
      - run: goreleaser check
      - run: make release
      - name: Verify snapshot archive checksums
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('dist/metadata.json', 'utf8')).version")
          node scripts/release.mjs verify dist "$version"
      - name: Test extracted snapshot binary
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "JSON.parse(require('fs').readFileSync('dist/metadata.json', 'utf8')).version")
          mkdir -p "$RUNNER_TEMP/specview-extracted"
          tar -xzf "dist/specview_${version}_linux_amd64.tar.gz" -C "$RUNNER_TEMP/specview-extracted"
          node scripts/smoke.mjs "$RUNNER_TEMP/specview-extracted/specview" "$version"

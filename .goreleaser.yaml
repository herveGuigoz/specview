version: 2
project_name: specview

before:
  hooks:
    - make frontend

builds:
  - id: specview
    main: ./cmd/specview
    binary: specview
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: specview
    formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - README.md

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

release:
  draft: true
  name_template: 'specview v{{ .Version }}'
